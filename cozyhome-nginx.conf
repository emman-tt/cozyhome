server {
   listen 443 ssl;
   listen [::]:443 ssl;
   server_name cozyhome.emmanverse.uk www.cozyhome.emmanverse.uk;

   ssl_certificate     /etc/ssl/cloudflare/emmanverse.uk.pem;
   ssl_certificate_key /etc/ssl/cloudflare/emmanverse.uk.key;
  
  location / {
     proxy_pass http://127.0.0.1:3002;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
  }

}